name: flake-update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: true

# Upstream source fetches (github.com archive CDN) intermittently return
# 503/504. These settings make Nix retry harder before giving up.
env:
  NIX_CONFIG: |
    download-attempts = 10
    connect-timeout = 30
    stalled-download-timeout = 300

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        run: nix flake update

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push update branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B flake-update
          git add flake.lock
          git commit -m "flake.lock: daily update"
          git push --force origin flake-update

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # Match only an open PR: a closed one with the same head is still
          # found by `gh pr view`, which would silently skip creating a new one.
          if gh pr view flake-update --state open --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PR already open"
            exit 0
          fi
          gh pr reopen flake-update --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head flake-update --base "$BASE" \
            --title "flake.lock: daily update" \
            --body "Automated daily \`nix flake update\`. Merges automatically if all host builds and \`nix flake check\` pass."

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - hutch
          - minihutch
          - chris-framework
          - chris-desktop
          - chris-wsl
          - install-iso
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flake-update

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build ${{ matrix.host }}
        run: |
          for attempt in 1 2 3; do
            if nix build --no-link ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"; then
              exit 0
            fi
            echo "build attempt $attempt failed, retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flake-update

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: nix flake check
        run: |
          for attempt in 1 2 3; do
            if nix flake check; then
              exit 0
            fi
            echo "check attempt $attempt failed, retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1

  merge:
    needs: [update, build, check]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge flake-update --repo "$GITHUB_REPOSITORY" --squash --delete-branch
