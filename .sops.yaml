keys:
  # Master key, held in 1Password. Every secret is encrypted to it, and it is
  # the key deployed to hutch for the containers whose own key was lost.
  - &laptop age132q904eh8nk60sxel90e6n09k0sq6u4908sxz87gf33lwlgpwu6qeuvr49
  # caddy still has a distinct per-container key, at
  # /var/lib/sops-nix/caddy/keys.txt on hutch.
  - &caddy age1h9eg8cl50usge2e5sjr77pes2l0wgl3ypk95jd4w32m88yhpugnsd9dpl4
  # hutch itself, for host-level secrets (the B2 backup credentials). Derived
  # from its SSH host key, so there is no separate key file to deploy —
  # sops-nix reads /etc/ssh/ssh_host_ed25519_key directly. Regenerate with:
  #   ssh-keyscan -t ed25519 192.168.1.2 | ssh-to-age
  - &hutch age1lz2haqrsgtm3ug6gh8apapjf8qp608f3xffhrnjuwnargu3rjqlqru0ukx

# immich and uptime used to have per-host keys too, but both died with the
# hardware they lived on (see hosts/containers/uptime.nix). They now decrypt
# with a copy of the *laptop* key, deployed to /var/lib/sops-nix/<name>/ on
# hutch — so their old recipients are gone from here. Tradeoff: the master key
# lives on hutch, so compromising that box exposes every secret. Acceptable for
# a homelab; issue dedicated keys and re-run `sops updatekeys` to undo it.
creation_rules:
  - path_regex: .*secrets/caddy\.yaml$
    key_groups:
      - age:
          - *laptop
          - *caddy

  # Host-level secrets for hutch. Must precede the catch-all below —
  # creation_rules are first-match.
  - path_regex: .*secrets/hutch\.yaml$
    key_groups:
      - age:
          - *laptop
          - *hutch

  # Everything else: laptop key only.
  - path_regex: .*secrets/.*\.yaml$
    key_groups:
      - age:
          - *laptop
