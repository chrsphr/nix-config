when:
  - event: schedule
    schedule:
      - cron: "H 4 * * *"
        timezone: UTC
  - event: manual
  - event: push
    branch: main

engine: microvm
image: nixos

dependencies:
  - git
  - openssh

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

steps:
  - name: update, build, push
    command: |
      set -euo pipefail

      echo "cpu: $(nproc)  mem: $(free -m | awk '/^Mem:/{print $2" MiB"}')  disk: $(df -h /workspace | awk 'NR==2{print $4" free"}')"

      # Pushes only validate; scheduled and manual runs also update the lock.
      if [ "$TANGLED_PIPELINE_KIND" != "push" ]; then
        nix flake update
        if git diff --quiet -- flake.lock; then
          echo "flake.lock unchanged, nothing to do"
          exit 0
        fi
      fi

      # One build at a time: the microVM has little memory to spare and Nix
      # otherwise runs as many compilers as there are cores.
      for h in hutch minihutch chris-framework chris-desktop chris-wsl install-iso; do
        echo "=== $h"
        nix build --no-link --max-jobs 1 --cores 1 ".#nixosConfigurations.$h.config.system.build.toplevel"
      done
      nix flake check --max-jobs 1

      # Only the lock-update runs push back to main.
      [ "$TANGLED_PIPELINE_KIND" = "push" ] && exit 0

      mkdir -p ~/.ssh
      printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/tangled_ci
      chmod 600 ~/.ssh/tangled_ci
      printf '%s\n' "tangled.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII2UShEm/FFPmYZUizaPnIqOJuynoCQpcLhl5PPHd02n" > ~/.ssh/known_hosts
      export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tangled_ci -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes"

      git remote set-url origin git@tangled.org:chrsphr.uk/nix-config
      git config user.name "tangled-ci"
      git config user.email "tangled-ci@chrsphr.uk"
      git checkout -B main
      git add flake.lock
      git commit -m "flake.lock: daily update"
      git push -o skip-ci origin main
